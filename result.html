<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Molecule Detail</title>
    <base href="/bioinf/TDMol/static/jsmol/j2s/">
    <style>
        body { background-color: #f3f3ff; }
        .vf-body { min-height: 60vh; }
        .hero-banner { background-color: #2c3e50; color: #ffffff; padding: 80px 20px 40px 20px; text-align: center; position: relative; }
        .hero-nav-container { position: absolute; top: 0; left: 0; width: 100%; background-color: rgba(0, 0, 0, 0.2); padding: 10px 0; }
        .hero-banner .vf-navigation__link { color: #ecf0f1; padding: 8px 16px; border-bottom: 2px solid transparent; transition: color 0.2s, border-bottom-color 0.2s; }
        .hero-banner .vf-navigation__link:hover { color: #ffffff; text-decoration: none; }
        .hero-banner .vf-navigation__link[aria-current='page'] { color: #ffffff; font-weight: bold; border-bottom-color: #3498db; }
        .hero-banner h1 { font-size: 3rem; font-weight: 700; margin: 0; }
        .hero-banner p { font-size: 1.25rem; color: #bdc3c7; margin-top: 10px; }
        .pagination-nav { display: flex; justify-content: center; margin-top: 24px; }
        .pagination-list { display: flex; list-style: none; padding: 0; margin: 0; border: 1px solid #d9d9d9; border-radius: 4px; overflow: hidden; }
        .pagination-item { margin: 0; }
        .pagination-link { display: block; padding: 8px 16px; color: #007c82; text-decoration: none; border-right: 1px solid #d9d9d9; transition: background-color 0.2s; }
        .pagination-item:last-child .pagination-link { border-right: none; }
        .pagination-item:not(.disabled) .pagination-link:hover { background-color: #f0f8ff; }
        .pagination-item.active .pagination-link { background-color: #007c82; color: #ffffff; font-weight: bold; cursor: default; }
        .pagination-item.disabled .pagination-link { color: #aaaaaa; background-color: #f8f8f8; pointer-events: none; cursor: not-allowed; }
    </style>
</head>
<body>
    <section class="hero-banner">
        <div class="hero-nav-container">
            <nav class="vf-navigation">
                <ul class="vf-navigation__list" style="display: flex; list-style: none; padding: 0; margin: 0; justify-content: center;">
                    
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf/TDMol/" class="vf-navigation__link" aria-current="page">Home</a>
                    </li>
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf/TDMol/introduction.html" class="vf-navigation__link">Introduction</a>
                    </li>
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf/TDMol/code.html" class="vf-navigation__link">Code</a>
                    </li>
                </ul>
            </nav>
            
            <script type="text/javascript" src="/bioinf/TDMol/static/jsmol/JSmol.min.js"></script>
        </div>
        
    
    </section>
    <main class="vf-body">
        <section class="vf-grid vf-grid__col-1" style="padding-top: 48px;">
            <div class="vf-content" id="result-content">
                <div id="loading-indicator" style="text-align: center; padding: 50px;">
                    <div class="loader" style="margin: 0 auto;"></div>
                    <p>正在加载分子详情...</p>
                </div>
            </div>
        </section>
        </main>

    <footer class="vf-footer">
        </footer>

    <script type="text/javascript" src="/bioinf/TDMol/static/jsmol/JSmol.min.js"></script>
    
    <script>
        // ★★★★★ 关键修改 2: 硬编码 URL ★★★★★
        const BACKEND_API_URL = "http://202.121.180.146:2348";
        const APP_BASE_PATH = "/bioinf/TDMol";

        // ★★★★★ 关键修改 3: 从 URL 查询参数中读取变量 ★★★★★
        const urlParams = new URLSearchParams(window.location.search);
        const moleculeId = parseInt(urlParams.get('molecule_id'));
        const task_id = urlParams.get('task_id');
        const rank = parseInt(urlParams.get('rank'));
        
        const resultContent = document.getElementById('result-content');
        const loadingIndicator = document.getElementById('loading-indicator');

        // ★★★★★ 关键修改 4: 修复 j2sPath ★★★★★
        const jmolInfo = {
            width: "100%", height: "400px", color: "#ffffff", use: "HTML5",
            j2sPath: "{{ url_for('static', filename='jsmol/j2s') }}",
            serverURL: "https://chemapps.stolaf.edu/jmol/jsmol/php/jsmol.php",
            script: "set defaultColorScheme CPK; background white; wireframe off; spacefill off; backbone off; cartoons off; lcarbs off; " +
                    "set animfps 20; set antialiasdisplay; set zoomlarge false; set echo_debug false; set echo_dot false; ",
            disableJ2SLoadMonitor: true, console: "none"
        };
        
        async function fetchAndRenderMolecule() {
            try {
                // ★ 调用 /api/result 接口 (不变)
                const response = await fetch(BACKEND_API_URL + `/api/result/${moleculeId}`);
                const data = await response.json();
                loadingIndicator.style.display = 'none';
                if (data.status !== 'success') {
                     resultContent.innerHTML = `...`; // 错误 HTML
                    return;
                }

                const mol = data.molecule;
                const task = data.task;

                // ★★★★★ 关键修改 5: 构造返回 brief.html 的链接 ★★★★★
                const backUrl = `${APP_BASE_PATH}/brief.html?task_id=${task_id || task.task_id}`;

                const xyzDataBase64 = mol.xyz_data;
                const xyzDataDecoded = atob(xyzDataBase64);
                
                // 3. 构建页面 HTML
                let html = `
                    <p><a href="${backUrl}" class="vf-link">&laquo; Back to Results Overview</a></p>
                    `;
                resultContent.innerHTML = html;

                // ★ JSmol 初始化 (不变)
                Jmol.setDocument(false);
                Jmol.getApplet("jmol_applet", jmolInfo);
                Jmol.script(jmolApplet, `load "data:text/plain;base64,${mol.xyz_data}"`);
                Jmol.script(jmolApplet, "spacefill 23%; wireframe 0.15; center all; zoom 100%;");

            } catch (error) {
                console.error('Error fetching molecule data:', error);
                loadingIndicator.style.display = 'none';
                resultContent.innerHTML = `...`;
            }
        }
        document.addEventListener('DOMContentLoaded', fetchAndRenderMolecule);
    </script>
    </body>
</html>
