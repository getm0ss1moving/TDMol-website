<!DOCTYPE html>
xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Molecule Detail</title>
    <base href="/bioinf2/edm_web/static/jsmol/j2s/">
    <style>
        body { background-color: #f3f3ff; }
        .vf-body { min-height: 60vh; }
        .hero-banner { background-color: #2c3e50; color: #ffffff; padding: 80px 20px 40px 20px; text-align: center; position: relative; }
        .hero-nav-container { position: absolute; top: 0; left: 0; width: 100%; background-color: rgba(0, 0, 0, 0.2); padding: 10px 0; }
        .hero-banner .vf-navigation__link { color: #ecf0f1; padding: 8px 16px; border-bottom: 2px solid transparent; transition: color 0.2s, border-bottom-color 0.2s; }
        .hero-banner .vf-navigation__link:hover { color: #ffffff; text-decoration: none; }
        .hero-banner .vf-navigation__link[aria-current='page'] { color: #ffffff; font-weight: bold; border-bottom-color: #3498db; }
        .hero-banner h1 { font-size: 3rem; font-weight: 700; margin: 0; }
        .hero-banner p { font-size: 1.25rem; color: #bdc3c7; margin-top: 10px; }
    </style>
</head>
<body>
    <section class="hero-banner">
        <div class="hero-nav-container">
            <nav class="vf-navigation">
                <ul class="vf-navigation__list" style="display: flex; list-style: none; padding: 0; margin: 0; justify-content: center;">
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf2/edm_web/" class="vf-navigation__link" aria-current="page">Home</a>
                    </li>
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf2/edm_web/introduction.html" class="vf-navigation__link">Introduction</a>
                    </li>
                    <li class="vf-navigation__item" style="margin: 0 15px;">
                        <a href="/bioinf2/edm_web/code.html" class="vf-navigation__link">Code</a>
                    </li>
                </ul>
            </nav>
            <script type="text/javascript" src="/bioinf2/edm_web/static/jsmol/JSmol.min.js"></script>
        </div>
        <h1>MoleculeCreater with EDM</h1>
        <p>Molecule Detail</p>
    </section>

    <main class="vf-body">
        <section class="vf-grid vf-grid__col-1" style="padding-top: 48px;">
            <div class="vf-content" id="result-content">
                <div id="loading-indicator" style="text-align: center; padding: 50px;">
                    <div class="loader" style="margin: 0 auto;"></div>
                    <p>正在加载分子详情...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="vf-footer"></footer>

    <script type="text/javascript" src="/bioinf2/edm_web/static/jsmol/JSmol.min.js"></script>
    <script>
        const APP_BASE_PATH = "/bioinf2/edm_web";
        const DATA_BASE_PATH = `${APP_BASE_PATH}/data`;

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('task_id');
        const moleculeId = urlParams.get('molecule_id');
        const rank = parseInt(urlParams.get('rank'), 10) || null;

        const resultContent = document.getElementById('result-content');
        const loadingIndicator = document.getElementById('loading-indicator');

        const jmolInfo = {
            width: "100%", height: "400px", color: "#ffffff", use: "HTML5",
            j2sPath: "/bioinf2/edm_web/static/jsmol/j2s",
            serverURL: "https://chemapps.stolaf.edu/jmol/jsmol/php/jsmol.php",
            script: "set defaultColorScheme CPK; background white; wireframe off; spacefill off;",
            disableJ2SLoadMonitor: true, console: "none"
        };

        async function fetchAndRenderMolecule() {
            if (!taskId || !moleculeId) {
                loadingIndicator.style.display = 'none';
                resultContent.innerHTML = '<p style="color:red;">缺少任务或分子编号。</p>';
                return;
            }
            try {
                const response = await fetch(`${DATA_BASE_PATH}/tasks/${taskId}/molecules/${moleculeId}.json?ts=${Date.now()}`);
                if (!response.ok) throw new Error('分子文件尚未就绪');
                const data = await response.json();
                loadingIndicator.style.display = 'none';
                if (data.status !== 'success') {
                    resultContent.innerHTML = `<p style="color:red;">加载失败：${data.message || '未知错误'}</p>`;
                    return;
                }

                const mol = data.molecule;
                const task = data.task || {};
                const backUrl = `${APP_BASE_PATH}/brief.html?task_id=${taskId}`;

                let html = `
                    <div style="background-color:#fff;padding:24px 32px;border:1px solid #d9d9d9;">
                        <p><a href="${backUrl}" class="vf-link">&laquo; Back to Results Overview</a></p>
                        <h2 class="vf-text-heading--2">Molecule #${rank || mol.id}</h2>
                        <p><strong>Task:</strong> ${task.task_id || taskId}</p>
                        <p><strong>SMILES:</strong> <code>${mol.smiles || '-'}</code></p>
                        <p><strong>Score:</strong> ${mol.score ?? '-'}</p>
                        <div id="jmol-container" style="margin-top:24px;"></div>
                        <div style="margin-top:16px;">
                            <a class="vf-button vf-button--secondary" href="${APP_BASE_PATH}/data/tasks/${taskId}/structures/${mol.id}.xyz" download>Download XYZ</a>
                            ${mol.image_path ? `<a class="vf-button vf-button--secondary" href="${APP_BASE_PATH}/${mol.image_path}" download>Download Image</a>` : ''}
                        </div>
                    </div>
                `;

                resultContent.innerHTML = html;

                if (window.Jmol) {
                    Jmol.setDocument(false);
                    window.jmol_applet = Jmol.getApplet("jmol_applet", jmolInfo);
                    document.getElementById('jmol-container').innerHTML = Jmol.getAppletHtml(jmol_applet);
                    Jmol.script(jmol_applet, `load \"${APP_BASE_PATH}/data/tasks/${taskId}/structures/${mol.id}.xyz\"; spacefill 23%; wireframe 0.12;`);
                }
            } catch (error) {
                console.error('Error fetching molecule data:', error);
                loadingIndicator.style.display = 'none';
                resultContent.innerHTML = `<p style="color:red;">无法加载分子详情：${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAndRenderMolecule);
    </script>
</body>
</html>
